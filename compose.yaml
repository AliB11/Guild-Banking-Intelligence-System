services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gbi
      POSTGRES_USER: gbi
      POSTGRES_PASSWORD: gbi_local_only
    volumes:
      - gbi-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gbi -d gbi"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://gbi:gbi_local_only@db:5432/gbi
      ALLOW_DEMO_MODE: "false"
      RUN_DB_MIGRATIONS: "true"
      DB_POOL_MAX: "5"
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12

  # Explicitly opt into the destructive demo reset:
  # docker compose --profile seed run --rm seed
  seed:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    profiles: ["seed"]
    environment:
      DATABASE_URL: postgresql://gbi:gbi_local_only@db:5432/gbi
      ALLOW_DESTRUCTIVE_SEED: "true"
    command: ["npm", "run", "db:seed"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  gbi-postgres:
