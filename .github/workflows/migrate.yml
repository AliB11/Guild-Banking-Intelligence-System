name: Migrate database

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Run the committed non-destructive Drizzle migrations"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  migrate:
    if: ${{ inputs.confirm == true }}
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations
        run: npm run db:migrate
